name: Deploy Firebase (functions + Firestore)

# Deploys Cloud Functions and Firestore rules/indexes to the pexli-drop project.
# Runs automatically when backend files change on main, and can be run on demand
# from the Actions tab ("Run workflow"). No terminal needed on your machine.
#
# One-time setup (browser only):
#   1. Firebase console -> Project settings -> Service accounts ->
#      "Generate new private key" -> download the JSON.
#   2. Google Cloud console -> IAM -> give that service account the "Owner" role
#      (or Editor + Service Account User) so it can deploy.
#   3. GitHub repo -> Settings -> Secrets and variables -> Actions ->
#      New repository secret named FIREBASE_SERVICE_ACCOUNT -> paste the JSON.
#   4. Actions tab -> this workflow -> "Run workflow".

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - ".github/workflows/deploy-firebase.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Write service account key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set. See the setup steps in this workflow file."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"

      # Inject the confidential X client secret from a GitHub secret into the
      # committed functions/.env — so the real secret never lives in the repo.
      - name: Inject X_CLIENT_SECRET (if set)
        env:
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
        run: |
          if [ -n "$X_CLIENT_SECRET" ]; then
            grep -v '^X_CLIENT_SECRET=' functions/.env > functions/.env.tmp || true
            printf 'X_CLIENT_SECRET=%s\n' "$X_CLIENT_SECRET" >> functions/.env.tmp
            mv functions/.env.tmp functions/.env
            echo "X_CLIENT_SECRET injected into functions/.env"
          else
            echo "No X_CLIENT_SECRET secret set — skipping (public-client / PKCE mode)."
          fi

      # Inject the faucet signer key from a GitHub secret so the real key never
      # lives in the repo. Empty secret = the in-app faucet stays disabled.
      - name: Inject FAUCET_PRIVATE_KEY (if set)
        env:
          FAUCET_PRIVATE_KEY: ${{ secrets.FAUCET_PRIVATE_KEY }}
        run: |
          if [ -n "$FAUCET_PRIVATE_KEY" ]; then
            grep -v '^FAUCET_PRIVATE_KEY=' functions/.env > functions/.env.tmp || true
            printf 'FAUCET_PRIVATE_KEY=%s\n' "$FAUCET_PRIVATE_KEY" >> functions/.env.tmp
            mv functions/.env.tmp functions/.env
            echo "FAUCET_PRIVATE_KEY injected into functions/.env"
          else
            echo "No FAUCET_PRIVATE_KEY secret set — skipping (in-app faucet disabled)."
          fi

      # Every failed deploy leaves behind a non-serving Cloud Run revision that
      # still reserves CPU against the project/region quota. After a few failures
      # these orphans pile up and exhaust "total allowable CPU per project per
      # region", so ALL functions then fail with a quota error. Before deploying,
      # delete every revision that is NOT the one currently serving traffic to
      # reclaim that CPU. Safe: the active (serving) revision is always kept.
      - name: Reclaim CPU — delete orphan Cloud Run revisions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud config set project pexli-drop --quiet
          for svc in $(gcloud run services list --region=us-central1 --format='value(metadata.name)'); do
            active=$(gcloud run services describe "$svc" --region=us-central1 \
              --format='value(status.traffic.revisionName)' 2>/dev/null | tr ';' '\n' | head -n1)
            for rev in $(gcloud run revisions list --service="$svc" --region=us-central1 \
              --format='value(metadata.name)'); do
              if [ -n "$rev" ] && [ "$rev" != "$active" ]; then
                echo "→ deleting orphan revision $rev (service $svc, active=$active)"
                gcloud run revisions delete "$rev" --region=us-central1 --quiet || true
              fi
            done
          done

      # Delete retired functions' Cloud Run services to free CPU quota. These
      # were replaced (verifyFaucet→claimFaucet, verifySwap/verifyTx→verifyTxHash)
      # and are no longer in index.js, so scoped deploys never remove them; do it
      # explicitly. Freeing ~3 services gives the remaining ones healthcheck
      # headroom under the tight per-region quota.
      - name: Delete retired functions (free CPU quota)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud config set project pexli-drop --quiet
          for svc in verifyfaucet verifyswap verifytx; do
            if gcloud run services describe "$svc" --region=us-central1 >/dev/null 2>&1; then
              echo "→ deleting retired service $svc"
              gcloud run services delete "$svc" --region=us-central1 --quiet || true
            fi
          done

      # Deploy in small batches. A full "deploy --only functions" spins up a
      # healthcheck container for EVERY function at once; ~28 of those plus the
      # already-serving revisions blow past the project's Cloud Run CPU quota, so
      # many functions fail. Deploying a few at a time keeps the simultaneous
      # healthcheck CPU low enough to stay under quota — no quota bump needed.
      - name: Deploy Firestore rules & indexes, then functions in batches
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npm install -g firebase-tools@latest
          firebase deploy --only firestore --project pexli-drop --non-interactive --force

          # Function names = every `exports.NAME` in functions/index.js.
          FNS=$(grep -oE '^exports\.[A-Za-z0-9_]+' functions/index.js | sed 's/^exports\.//' | sort -u)
          echo "Functions to deploy: $(echo "$FNS" | tr '\n' ' ')"

          BATCH=""
          N=0
          FAILED=""
          deploy_batch() {
            [ -z "$1" ] && return 0
            echo "::group::Deploying batch: $1"
            if ! firebase deploy --only "$1" --project pexli-drop --non-interactive --force; then
              echo "batch failed: $1"
              FAILED="$FAILED $1"
            fi
            echo "::endgroup::"
          }
          for fn in $FNS; do
            if [ -z "$BATCH" ]; then BATCH="functions:$fn"; else BATCH="$BATCH,functions:$fn"; fi
            N=$((N + 1))
            if [ "$N" -ge 6 ]; then deploy_batch "$BATCH"; BATCH=""; N=0; fi
          done
          deploy_batch "$BATCH"

          if [ -n "$FAILED" ]; then
            echo "::error::Some function batches failed:$FAILED"
            exit 1
          fi

      # 2nd-gen callable functions run on Cloud Run. If the invoker binding for
      # allUsers is missing (common after earlier broken deploys), the browser's
      # call is rejected before the code runs and the SDK reports a bare
      # "internal". Grant public invoke on every function's Cloud Run service.
      # Safe: onCall verifies the Firebase Auth token in-code; the HTTP endpoints
      # (xCallback / token-guarded bootstrapAdmin) are meant to be public.
      - name: Allow public invocation of functions (fix "internal")
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud config set project pexli-drop --quiet
          SERVICES=$(gcloud run services list --region=us-central1 --format='value(metadata.name)')
          echo "Cloud Run services: $SERVICES"
          for svc in $SERVICES; do
            echo "→ granting allUsers run.invoker on $svc"
            gcloud run services add-iam-policy-binding "$svc" \
              --region=us-central1 --platform=managed \
              --member=allUsers --role=roles/run.invoker --quiet || true
          done
