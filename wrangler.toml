# Cloudflare Worker (static assets) config for the Pexli airdrop SPA.
#
# This makes a *.workers.dev deploy serve the built Vite site from web/dist and
# fall back to index.html for client-side routes (so /admin etc. don't 404).
# The Worker name must match your worker subdomain: <name>.<subdomain>.workers.dev
name = "pexli-drop"
compatibility_date = "2024-11-01"

[assets]
directory = "./web/dist"
not_found_handling = "single-page-application"
